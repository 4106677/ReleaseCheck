name: ReleaseCheck CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: releasecheck
          POSTGRES_PASSWORD: releasecheck
          POSTGRES_DB: releasecheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releasecheck -d releasecheck_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://releasecheck:releasecheck@127.0.0.1:5432/releasecheck_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Use a job-local browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/releasecheck-browsers" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - name: Allow the downloaded Chromium sandbox on Ubuntu
        run: bash scripts/ci-browser-sandbox.sh
      - run: npm run check
      - run: npm run test:integration
      - name: Check the full baseline workflow and design previews in Chromium
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://releasecheck:releasecheck@127.0.0.1:5432/releasecheck_test
          FIXTURE_ORIGIN: http://127.0.0.1:4174
        run: |
          export ARTIFACT_DIR="$RUNNER_TEMP/releasecheck-artifacts"
          npm run db:migrate
          npm run dev > "$RUNNER_TEMP/releasecheck-stack.log" 2>&1 &
          stack_pid=$!
          trap 'kill "$stack_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/api/health > /dev/null &&
               curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              npm run test:smoke
              npm run test:recovery-ui
              npm run test:design
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/releasecheck-stack.log"
          exit 1
