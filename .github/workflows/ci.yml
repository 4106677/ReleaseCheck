name: ReleaseCheck CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: releasecheck
          POSTGRES_PASSWORD: releasecheck
          POSTGRES_DB: releasecheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releasecheck -d releasecheck_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://releasecheck:releasecheck@127.0.0.1:5432/releasecheck_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:integration
